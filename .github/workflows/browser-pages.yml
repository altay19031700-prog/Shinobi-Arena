name: Publish Shinobi Browser Game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/**'
      - '.github/workflows/browser-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: shinobi-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser game
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/assets/code/part-001.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets
      - id: deployment
        uses: actions/deploy-pages@v4
